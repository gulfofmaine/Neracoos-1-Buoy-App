repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: "src/stories/__snapshots__/storyshots.spec.ts.snap"
        # exclude: tests/data
      - id: check-ast
      - id: check-yaml
        # exclude: services/config_gen/service_configs/data.neracoos.org_geoapi/pygeoapi.config.yaml
      - id: check-xml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: check-docstring-first
      - id: check-added-large-files
        args: ["--maxkb=600"]
        exclude: package-lock.json
      - id: no-commit-to-branch

  - repo: https://github.com/rbubley/mirrors-prettier
    rev: "c035d5c3fc2ce295b961030061d09de67d9203dc" # frozen: v3.10.1
    hooks:
      - id: prettier

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: 06a39750ec31860bb44f2acf67182c40016cd1e7 # frozen: v1.32.0
    hooks:
      - id: zizmor
        files: "^\\.github"
        args: [--persona=pedantic]

  - repo: https://github.com/gulfofmaine/odp-releaser
    rev: 8f2bb6657c6ed7891105c501c4dd6fbf271990db # frozen: main
    hooks:
      - id: validate-deploy-targets

update:
  cooldown_days: 7
